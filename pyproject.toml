[project]
name = "rain-offchain"
version = "0.2.0"
description = "Off-chain utilities for the Rain protocol."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "eth-utils",
    "numpy",
]

[project.urls]
Repository = "https://github.com/act65/rain"

[dependency-groups]
dev = [
    "eth-ape>=0.8,<0.9",
    "ape-solidity>=0.8,<0.9",
    "pytest",
    "hypothesis",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
